<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MusicStore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        /* =========================
           BARRA DE NAVEGACIÓN
        ========================= */

        nav {
            height: 95px;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10%;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 30px;
            font-weight: 900;
            letter-spacing: 1px;
            color: white;
            text-decoration: none;
        }

        .logo span {
            color: #ffd000;
        }

        .logo-icon {
            color: white;
            margin-right: 8px;
        }

        .menu {
            display: flex;
            align-items: center;
            gap: 38px;
        }

        .menu a {
            color: #d8d8d8;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: 0.3s;
        }

        .menu a:hover {
            color: #ffd000;
        }

        .carrito {
            background: #ffd000;
            color: #111 !important;
            padding: 15px 23px;
            border-radius: 6px;
            font-weight: bold !important;
            border: 1px solid #ffe45e;
        }

        .carrito:hover {
            background: #e9bd00;
            color: #111 !important;
        }
        /* BOTÓN CERRAR SESIÓN */
.btn-cerrar-sesion {
    background: #e63946;
    color: white;
    border: none;
    padding: 15px 18px;
    border-radius: 6px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

.btn-cerrar-sesion:hover {
    background: #c1121f;
    transform: translateY(-2px);
}

        /* =========================
           CONTENIDO
        ========================= */

        .contenedor {
            width: 100%;
            margin: 0;
            padding: 0;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 95px);

            background-image:
                linear-gradient(
                    rgba(0, 0, 0, 0.72),
                    rgba(0, 0, 0, 0.62)
                ),
                url("https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;

            display: flex;
            align-items: center;

            padding: 80px 10%;
            position: relative;
        }

        .hero-contenido {
            max-width: 700px;
        }

        .hero-etiqueta {
            color: #ffd000;
            font-size: 17px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 28px;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(55px, 6vw, 88px);
            line-height: 0.98;
            font-weight: 900;
            letter-spacing: -3px;
        }

        .hero h1 .amarillo {
            color: #ffd000;
        }

        .hero p {
            max-width: 700px;
            font-size: 21px;
            line-height: 1.7;
            color: #e7e7e7;
            margin-top: 35px;
            margin-bottom: 35px;
        }

        /* =========================
           BOTONES
        ========================= */

        .botones {
            display: flex;
            gap: 18px;
            align-items: center;
        }

        .boton {
            display: inline-block;
            padding: 18px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 17px;
            font-weight: bold;
            transition: 0.3s;
        }

        .boton-amarillo {
            background: #ffd000;
            color: #111;
        }

        .boton-amarillo:hover {
            background: #e9bd00;
            transform: translateY(-2px);
        }

        .boton-transparente {
            background: transparent;
            color: white;
            border: 1px solid #777;
        }

        .boton-transparente:hover {
            border-color: #ffd000;
            color: #ffd000;
        }

        /* =========================
           CONTENIDO DE OTRAS PÁGINAS
        ========================= */

        .contenido-general {
            max-width: 1100px;
            margin: auto;
            padding: 60px 25px;
            min-height: 70vh;
        }

        .categorias {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        .categoria {
            background: white;
            color: #222;
            padding: 35px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 3px 10px #0005;
        }

        .categoria h2 {
            margin-bottom: 10px;
        }

        .productos {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin-top: 30px;
        }

        .producto {
            background: white;
            color: #222;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px #0005;
        }

        .producto h2 {
            margin-top: 0;
        }

        .precio {
            font-size: 22px;
            font-weight: bold;
            color: #059669;
        }

        .recibo {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            color: #222;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 3px 15px #0005;
            text-align: center;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111;
            color: #aaa;
            padding: 25px;
            text-align: center;
        }

        /* =========================
           CELULAR
        ========================= */

        @media (max-width: 900px) {

            nav {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }

            .menu {
                flex-wrap: wrap;
                justify-content: center;
                gap: 18px;
            }

            .hero {
                min-height: calc(100vh - 150px);
                padding: 70px 25px;
            }

            .hero h1 {
                font-size: 55px;
                letter-spacing: -2px;
            }

            .hero-etiqueta {
                font-size: 13px;
                letter-spacing: 3px;
            }

            .botones {
                flex-direction: column;
                align-items: flex-start;
            }

            .categorias,
            .productos {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 500px) {

            .logo {
                font-size: 25px;
            }

            .menu a {
                font-size: 15px;
            }

            .hero h1 {
                font-size: 43px;
            }

            .hero p {
                font-size: 17px;
            }

            .boton {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>

<body>

<nav>

    <a href="{% url 'inicio' %}" class="logo">
        <span class="logo-icon">♪</span>
        <span>MUSIC</span>STORE
    </a>

    <div class="menu">

        <a href="{% url 'inicio' %}">
            Inicio
        </a>

        <a href="{% url 'categorias' %}">
            Categorías
        </a>

        <a href="{% url 'viento' %}">
            Productos
        </a>

        <a href="{% url 'categorias' %}">
            Ofertas
        </a>

        <a href="{% url 'categorias' %}" class="carrito">
            🛒 Carrito (0)
        </a>

        {% if user.is_authenticated %}
    <form action="{% url 'logout' %}" method="POST" style="display: inline; margin: 0;">
        {% csrf_token %}
        <button type="submit" class="btn-cerrar-sesion">
            🚪 Cerrar sesión
        </button>
    </form>
{% endif %}
    </div>

</nav>

{% block contenido %}
{% endblock %}

<footer>
    <p>© 2026 MusicStore - Tienda de Instrumentos Musicales</p>
</footer>

</body>
</html>
