
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | MusicStore</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101020, #25254b, #6b21a8);
            color: white;
        }

        .tarjeta {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
        }

        .logo {
            text-align: center;
            font-size: 38px;
        }

        h1 {
            text-align: center;
            margin: 12px 0;
        }

        .subtitulo {
            text-align: center;
            color: #d1d1e5;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 17px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #777;
            border-radius: 9px;
            background: #f8f8ff;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 9px;
            background: #a855f7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #9333ea;
            transform: translateY(-2px);
        }

        .mensaje {
            padding: 11px;
            margin: 10px 0;
            border-radius: 8px;
            background: rgba(255, 80, 80, 0.18);
            color: #ffdada;
        }

        .enlace {
            text-align: center;
            margin-top: 22px;
            color: #e4e4f7;
        }

        a {
            color: #d8b4fe;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="tarjeta">

        <div class="logo">🎹</div>

        <h1>Bienvenido a MusicStore</h1>

        <p class="subtitulo">
            Inicia sesión para entrar a tu tienda musical.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="mensaje">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="correo">Correo electrónico</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="ejemplo@correo.com"
                autocomplete="username"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Escribe tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit">Iniciar sesión</button>
        </form>

        <p class="enlace">
            ¿No tienes cuenta?
            <a href="{% url 'registro' %}">Regístrate aquí</a>
        </p>

    </div>
</body>
</html>
